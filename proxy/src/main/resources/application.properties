spring.application.name=proxy
server.port=8080

# Redis configuration for caching and connection storage
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Data Warehouse nodes (multiple instances for load balancing)
proxy.datawarehouse.nodes=http://localhost:9001,http://localhost:9002

# Cache TTL in milliseconds (5 minutes)
proxy.cache.ttl=300000
